<div class="flex flex-row">
    <app-side-menu />
    <div class="basis-4/5 bg-zinc-900 p-6 mt-6 mb-3 mr-6 rounded-lg border border-zinc-700">
        <div class="flex flex-col gap-1 ml-3 mb-5">
            <span class="font-semibold text-4xl text-zinc-600">Item reviews</span>
            <span *ngIf="itemName" class="text-2xl text-zinc-400 font-bold">for {{itemName}}</span>
        </div>
        <app-review-item [urlID]='urlID' />
    </div>
</div>

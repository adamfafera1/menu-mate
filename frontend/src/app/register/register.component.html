<div routerLink='/browse' class="p-3 absolute top-0 left-0">
  <p-button router><i class="pi pi-arrow-left p-1"></i></p-button>
</div>
<div class="flex justify-center items-center min-h-screen">
  <div class="w-80">
    <span class="block text-center mb-4 text-xl">Register </span>
    <div class="mb-6 flex flex-col items-center">
      <p-selectButton inputId="role" [options]="roleOptions" [(ngModel)]="selectedRole" optionLabel="label"
        optionValue="value" class="w-64 max-w-full"></p-selectButton>
    </div>
    <p-floatLabel>
      <input pInputText #email type="email" id="email" required
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring" />
      <label for="email">Email</label>
    </p-floatLabel>
    <p-float-label class="mt-8">
      <input pInputText #userName type="text" required
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring" />
      <label for="userName">{{ nameFieldLabel }}</label>
    </p-float-label>
    <p-floatLabel class="mt-8">
      <input pInputText #password type="password" required
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring" (focus)="passwordFocused = true"
        (blur)="passwordFocused = false" />
      <label for="password">Password</label>
    </p-floatLabel>

    <!-- Password Requirements -->
    <div *ngIf="passwordFocused && password.value" class="mt-3 p-3 bg-zinc-900 rounded text-sm">
      <p class="font-semibold mb-2 text-gray-500">Password Requirements:</p>
      <div class="space-y-1">
        <div [ngClass]="hasMinLength(password.value) ? 'text-green-600' : 'text-gray-500'">
          <i [ngClass]="hasMinLength(password.value) ? 'pi pi-check' : 'pi pi-times'" class="mr-2"></i>
          At least 8 characters
        </div>
        <div [ngClass]="hasUpperCase(password.value) ? 'text-green-600' : 'text-gray-500'">
          <i [ngClass]="hasUpperCase(password.value) ? 'pi pi-check' : 'pi pi-times'" class="mr-2"></i>
          1 uppercase letter
        </div>
        <div [ngClass]="hasNumber(password.value) ? 'text-green-600' : 'text-gray-500'">
          <i [ngClass]="hasNumber(password.value) ? 'pi pi-check' : 'pi pi-times'" class="mr-2"></i>
          1 number
        </div>
        <div [ngClass]="hasSpecialChar(password.value) ? 'text-green-600' : 'text-gray-500'">
          <i [ngClass]="hasSpecialChar(password.value) ? 'pi pi-check' : 'pi pi-times'" class="mr-2"></i>
          1 special character (!@#$%^&* etc)
        </div>
      </div>
    </div>

    <p-floatLabel class="mt-8">
      <input pInputText #confirmPassword type="password" required
        class="w-full px-3 py-2 border rounded focus:outline-none focus:ring" />
      <label for="confirmPassword">Confirm password</label>
    </p-floatLabel>
    <div *ngIf="password.value && confirmPassword.value && password.value !== confirmPassword.value"
      class="mt-2 text-red-500 text-sm">
      Passwords do not match
    </div>
    <div class="flex justify-center mt-6">
      <p-button lable="Login" type="submit"
        [disabled]="!password.value || !confirmPassword.value || password.value !== confirmPassword.value || !isPasswordValid(password.value)"
        (click)="onRegister(email.value, userName.value, password.value)" class="w-auto max-w-xs"> Register </p-button>
    </div>
  </div>
</div>
<p-toast></p-toast>
